name: Build image

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

jobs:

  lint-dockerfile:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run hadolint
        uses: essentialkaos/hadolint-action@v1
        with: 
          files: Containerfile

  build:
    runs-on: ubuntu-latest
    needs: lint-dockerfile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up environment variables
        run: |
          GARAGE_VERSION=$(sed -ne 's|ARG GARAGE_VERSION\=\(.*\)|\1|p' Containerfile | tr + -)
          
          echo "GARAGE_VERSION=$GARAGE_VERSION" >> $GITHUB_ENV
          echo "IMAGE_TAG=garage" >> $GITHUB_ENV
      
      - name: Set up Buildah
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ env.IMAGE_TAG }}
          containerfiles: |
            Containerfile
          build-args: |
            SSH_AUTHORIZED_KEYS=${{ secrets.SSH_AUTHORIZED_KEYS }}
          extra-args: |
            --no-hosts
            --no-hostname
            --format=docker
            --isolation=chroot
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Push image with tags
        run: |
          REGISTRY_IMAGE="ghcr.io/${{ github.repository_owner }}/${IMAGE_TAG}"
          
          buildah push $IMAGE_TAG "${REGISTRY_IMAGE}:latest"
          buildah push $IMAGE_TAG "${REGISTRY_IMAGE}:${GARAGE_VERSION}"
          buildah push $IMAGE_TAG "${REGISTRY_IMAGE}:${GARAGE_VERSION}-${GITHUB_SHA::7}"
        env:
          GITHUB_REGISTRY: ghcr.io
      
